services:
  - type: web
    name: hinov-team-report
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: pnpm install --frozen-lockfile=false && pnpm build
    startCommand: node artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
