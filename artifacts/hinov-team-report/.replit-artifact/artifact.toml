kind = "mobile"
previewPath = "/"
title = "HINOV Team Report"
description = "A professional mobile workspace for HINOV Group collaborators to log daily activities, prepare individual weekly reports, track submission status, and manage their profile."
version = "1.0.0"
id = "artifacts/hinov-team-report"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24574

[services.development]
run = "pnpm --filter @workspace/hinov-team-report run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hinov-team-report", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/hinov-team-report", "run", "serve" ]

[services.env]
PORT = "24574"
BASE_PATH = "/"
